<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b17" />
    <meta
      name="description"
      content="별빛 사이를 질주하며 장애물을 피하는 브라우저 아케이드 게임"
    />
    <title>Neon Drift</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div class="brand" aria-label="게임 제목">
          <span class="brand-mark">ND</span>
          <div>
            <p class="eyebrow">ARCADE / 01</p>
            <h1>NEON DRIFT</h1>
          </div>
        </div>

        <div class="scoreboard" aria-live="polite">
          <div>
            <span>점수</span>
            <strong id="score">0000</strong>
          </div>
          <div>
            <span>최고</span>
            <strong id="best-score">0000</strong>
          </div>
        </div>
      </header>

      <section class="game-stage" aria-label="게임 화면">
        <canvas id="game" width="960" height="540"></canvas>

        <div class="scanlines" aria-hidden="true"></div>

        <div class="overlay is-visible" id="overlay">
          <p class="status-label" id="status-label">비행 준비 완료</p>
          <h2 id="status-title">빛보다 빠르게.<br />끝까지 살아남으세요.</h2>
          <p class="status-copy" id="status-copy">
            좌우로 움직여 운석을 피하고 에너지 코어를 모으세요.
          </p>
          <button class="primary-button" id="start-button" type="button">
            <span id="button-label">게임 시작</span>
            <span aria-hidden="true">→</span>
          </button>
        </div>

        <div class="pause-badge" id="pause-badge">일시정지</div>
      </section>

      <footer class="controls">
        <div class="key-guide" aria-label="키보드 조작법">
          <span class="key">A</span>
          <span class="key">←</span>
          <span>이동</span>
          <span class="divider"></span>
          <span class="key">D</span>
          <span class="key">→</span>
          <span>이동</span>
          <span class="divider"></span>
          <span class="key wide">SPACE</span>
          <span>일시정지</span>
        </div>

        <div class="touch-controls" aria-label="터치 조작">
          <button id="move-left" type="button" aria-label="왼쪽으로 이동">←</button>
          <button id="pause-button" type="button" aria-label="게임 일시정지">Ⅱ</button>
          <button id="move-right" type="button" aria-label="오른쪽으로 이동">→</button>
        </div>

        <p class="hint"><span></span> 코어 +100 · 시간 점수 +10</p>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="description" content="키보드와 터치로 즐기는 클래식 2048 퍼즐 게임" />
    <title>2048 — 숫자를 합쳐 2048을 만드세요</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="kicker">NUMBER PUZZLE</p>
          <h1>20<span>48</span></h1>
          <p class="intro">같은 숫자를 밀어서 합치고<br />마법의 숫자 <strong>2048</strong>에 도달하세요.</p>
        </div>

        <div class="score-area" aria-label="게임 점수">
          <div class="score-card">
            <span>점수</span>
            <strong id="score">0</strong>
            <em id="score-add" aria-hidden="true"></em>
          </div>
          <div class="score-card score-card--best">
            <span>최고</span>
            <strong id="best-score">0</strong>
          </div>
        </div>
      </header>

      <section class="toolbar" aria-label="게임 메뉴">
        <p><span class="desktop-help">방향키 또는 WASD</span><span class="mobile-help">화면을 스와이프</span>하여 움직이세요.</p>
        <div class="toolbar-actions">
          <button class="icon-button" id="undo-button" type="button" disabled aria-label="한 수 되돌리기" title="한 수 되돌리기">
            ↶ <span>되돌리기</span>
          </button>
          <button class="new-game-button" id="new-game-button" type="button">새 게임</button>
        </div>
      </section>

      <section class="game-wrap">
        <div class="game-board" id="game-board" aria-label="2048 게임 보드" tabindex="0">
          <div class="grid-background" aria-hidden="true">
            <div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div>
          </div>
          <div class="tile-layer" id="tile-layer"></div>

          <div class="game-message" id="game-message" role="dialog" aria-modal="true" aria-labelledby="message-title">
            <p class="message-tag" id="message-tag">게임 종료</p>
            <h2 id="message-title">한 번 더?</h2>
            <p id="message-copy">더 이상 움직일 수 있는 타일이 없습니다.</p>
            <div class="message-actions">
              <button class="continue-button" id="continue-button" type="button">계속하기</button>
              <button class="new-game-button" id="retry-button" type="button">다시 시작</button>
            </div>
          </div>
        </div>

        <div class="game-meta">
          <div class="move-count">
            <span>이동 횟수</span>
            <strong id="move-count">0</strong>
          </div>
          <div class="progress-copy">
            <span id="progress-label">다음 목표</span>
            <strong id="next-target">128</strong>
          </div>
        </div>
      </section>

      <footer>
        <p><strong>TIP</strong> 가장 큰 타일을 한쪽 모서리에 유지해 보세요.</p>
        <p class="signature">BUILT WITH HTML · CSS · JAVASCRIPT</p>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
